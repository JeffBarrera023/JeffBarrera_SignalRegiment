<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signal Regiment Personnel - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">
        <section class="login-visual" aria-label="Signal Regiment personnel operations"></section>

        <section class="login-card">

            <div class="login-header">

                <p class="eyebrow">
                    Signal Regiment
                </p>

                <h1>
                    Personnel Management System
                </h1>

                <p class="login-subtitle">
                    Please sign in to continue
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                ></p>

            </form>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
